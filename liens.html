<!DOCTYPE html>
<html lang="fr">
<head>

    <title>Biltiau Nathan | Liens</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .links-container {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: center;
        }
        .platform-link {
            display: block;
            padding: 20px;
            background: var(--bg-card);
            color: var(--text-main);
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s ease;
        }
        .platform-link:hover {
            background: var(--accent);
            color: #000;
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">Biltiau Nathan</a>
        <div class="nav-links">
            <a href="index.html">Accueil</a>
            <a href="media.html">Médias & Vidéos</a>
            <a href="liens.html" class="active">Plateformes & Contact</a>
        </div>
    </nav>

    <main>
        <div class="links-container">
            <h1 style="font-size: 2.5rem;">Écouter & Suivre</h1>
            <p>Retrouvez-moi sur vos plateformes préférées.</p>
            
            <!-- Remplace les # par tes vrais liens -->
            <a href="#" class="platform-link">🎧 Écouter sur Spotify</a>
            <a href="#" class="platform-link">🍎 Apple Music</a>
            <a href="#" class="platform-link">📺 Chaîne YouTube</a>
            <a href="#" class="platform-link">📸 Instagram (@toninsta)</a>
            
            <h2 style="margin-top: 50px;">Contact Booking / Studio</h2>
            <a href="mailto:tonemailpro@gmail.com" class="platform-link" style="background: transparent; border-color: var(--accent); color: var(--accent);">
                ✉️ tonemailpro@gmail.com
            </a>
        </div>
    </main>

    <footer>
        © 2024 Biltiau Nathan. Tous droits réservés.
    </footer>

</body>
</html>
