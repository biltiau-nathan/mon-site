    <style>
        .grid-corporate { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 40px; margin-bottom: 60px; }
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; background: #111; border: 1px solid #333; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .photo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .photo-grid img { width: 100%; height: 300px; object-fit: cover; border: 1px solid #333; filter: grayscale(100%); transition: filter 0.4s; }
        .photo-grid img:hover { filter: grayscale(0%); }
        /* Style pour aligner le titre et le bouton */
        .header-media { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; margin-bottom: 40px; border-bottom: 1px solid #333; padding-bottom: 15px; }
        .header-media h2 { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    </style>
