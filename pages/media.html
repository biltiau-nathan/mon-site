<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biltiau Nathan | Médias</title>
    <!-- On remonte d'un dossier pour trouver le style -->
    <link rel="stylesheet" href="style.css">
    <style>
        .grid-corporate {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 40px;
            margin-bottom: 60px;
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #111;
            border: 1px solid #333;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .photo-grid img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border: 1px solid #333;
            filter: grayscale(100%);
            transition: filter 0.4s;
        }
        .photo-grid img:hover {
            filter: grayscale(0%);
        }
    </style>
</head>
<body style="padding-top: 80px;">

    <nav>
        <a href="../index.html" class="logo">Biltiau Nathan</a>
        <div class="nav-links">
            <a href="../index.html">Profil</a>
            <a href="media.html" class="active">Médias</a>
            <a href="liens.html">Réseaux & Contact</a>
        </div>
    </nav>

    <section class="content-section" style="min-height: 80vh;">
        <div class="container">
            <h2>Archives Vidéos</h2>
            <div class="grid-corporate">
                <!-- Intégration YouTube -->
                <div class="video-wrapper">
                    <iframe src="https://www.youtube.com/embed/ID_DE_LA_VIDEO" frameborder="0" allowfullscreen></iframe>
                </div>
                <div class="video-wrapper">
                    <iframe src="https://www.youtube.com/embed/ID_DE_LA_VIDEO" frameborder="0" allowfullscreen></iframe>
                </div>
            </div>

            <h2 style="margin-top: 80px;">Photographies</h2>
            <div class="photo-grid">
                <!-- On remonte d'un dossier pour trouver les images -->
                <img src="../BILTIAU_nathan/biltiau-nathan%20(2).jpg" alt="Presse 1">
                <img src="../BILTIAU_nathan/biltiau-nathan%20(8).jpg" alt="Presse 2">
                <img src="../BILTIAU_nathan/biltiau-nathan%20(1).jpg" alt="Presse 3">
            </div>
        </div>
    </section>

    <footer>
        © 2024 Biltiau Nathan — Tous droits réservés.
    </footer>

</body>
</html>
